name: Sync uml_data.json to gh-pages

on:
  push:
    branches:
      - develop
    paths:
      - 'docs/uml_data.json'

jobs:
  sync-file:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages:gh-pages
      
      - name: Copy file to gh-pages
        run: |
          git checkout gh-pages
          mkdir -p docs
          git checkout develop -- docs/uml_data.json
          git add docs/uml_data.json
          git commit -m "Update uml_data.json from develop branch" || echo "No changes to commit"
          git push origin gh-pages