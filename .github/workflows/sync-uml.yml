name: Sync UML Data to gh-pages

on:
  push:
    branches:
      - develop

jobs:
  sync-uml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if uml_data.json changed
        id: diffcheck
        run: |
          if git diff --name-only HEAD~1 HEAD | grep "uml_data.json"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if no changes
        if: steps.diffcheck.outputs.changed == 'false'
        run: echo "uml_data.json 沒有變更，跳過部署流程"

      - name: Checkout gh-pages branch
        if: steps.diffcheck.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Copy updated uml_data.json to gh-pages/docs
        if: steps.diffcheck.outputs.changed == 'true'
        run: |
          git checkout develop -- uml_data.json
          mkdir -p docs
          cp uml_data.json docs/uml_data.json

      - name: Commit & Push to gh-pages
        if: steps.diffcheck.outputs.changed == 'true'
        run: |
          git add docs/uml_data.json
          git commit -m "Update uml_data.json from develop"
          git push origin gh-pages
