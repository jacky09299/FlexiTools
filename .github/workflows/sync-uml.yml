name: Sync UML Data to gh-pages

on:
  push:
    branches:
      - develop

jobs:
  sync-uml:
    runs-on: ubuntu-latest

    steps:
      # 1. 在 develop 分支檢查變更
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Check if uml_data.json changed
        id: diffcheck
        run: |
          if git diff --name-only HEAD~1 HEAD | grep "uml_data.json"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # 2. 如果有變更，先上傳檔案 (Upload Artifact)
      - name: Upload uml_data.json artifact
        if: steps.diffcheck.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uml-data
          path: uml_data.json

      # 3. 切換到 gh-pages 分支
      - name: Checkout gh-pages branch
        if: steps.diffcheck.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      # 4. 下載檔案 (Download Artifact) - 不需要 git checkout 指令了
      - name: Download uml_data.json artifact
        if: steps.diffcheck.outputs.changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: uml-data
          path: temp_download # 先下載到暫存資料夾

      # 5. 提交變更
      - name: Commit & Push to gh-pages
        if: steps.diffcheck.outputs.changed == 'true'
        run: |
          mkdir -p docs
          # 從暫存資料夾複製過去
          cp temp_download/uml_data.json docs/uml_data.json
          
          # 設定 Git 使用者身份 (必須設定，否則 commit 會失敗)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add docs/uml_data.json
          git commit -m "Update uml_data.json from develop"
          git push origin gh-pages