name: Extract UML Info on Main Push

# 改為監聽 main 分支的 push 事件
on:
  push:
    branches:
      - main

jobs:
  update-develop-uml:
    runs-on: ubuntu-latest
    # 給予寫入權限以允許 push
    permissions:
      contents: write

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop      # 1. 鎖定操作 develop 分支
          fetch-depth: 0    # 2. 抓取完整歷史以便進行 merge

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync main into develop
        # 關鍵步驟：
        # 因為你是直接 push main，Action 執行當下 origin/develop 可能還在舊版本。
        # 我們必須先把剛 push 到 main 的東西 merge 回 develop，確保腳本跑到的是新程式碼。
        run: |
          echo "Merging origin/main into develop to ensure code is up-to-date..."
          git merge origin/main --no-edit

      # 如有依賴套件請解除註解
      # - name: Install dependencies
      #   run: pip install -r requirements.txt

      - name: Run Extraction Script
        run: python tools/extract_uml_info.py

      - name: Commit and Push changes
        run: |
          git add .
          
          # 檢查是否有變更
          if git diff-index --quiet HEAD; then
            echo "No changes detected from script. Skipping push."
          else
            echo "UML info updated. Pushing to develop..."
            # [skip ci] 避免 develop 分支的 CI 被重複觸發
            git commit -m "chore: auto-generate UML info after main update [skip ci]"
            git push origin develop
          fi