name: Extract UML Info on Main Push

on:
  push:
    branches:
      - main

jobs:
  update-develop-uml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          # 【關鍵修改】使用 PAT，這樣 Push 才能觸發其他 Action
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure Git
        run: |
          # 這裡依然可以用 bot 的名字，不影響觸發機制
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync main into develop
        run: |
          echo "Merging origin/main into develop..."
          git merge origin/main --no-edit

      - name: Run Extraction Script
        run: python tools/extract_uml_info.py

      - name: Commit and Push changes
        run: |
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes detected. Skipping push."
          else
            echo "Changes detected. Pushing to develop..."
            
            # 【關鍵修改】移除了 [skip ci]，並且因為上方用了 PAT，
            # 這裡的 push 會被 GitHub 視為有效事件，觸發 develop 的其他 action。
            git commit -m "chore: auto-generate UML info after main update"
            
            git push origin develop
          fi